name: Release Linux

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release-linux:
    runs-on: ubuntu-22.04
    # tauri-action needs write access to create/update the GitHub Release —
    # some repos/orgs default GITHUB_TOKEN to read-only, which would 403.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WebKitGTK/GTK for the Tauri webview, plus Poppler for the app's
      # own runtime PDF dependency (pdftotext/pdfseparate/pdfinfo/pdfunite).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            poppler-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Clock Analytics ${{ github.ref_name }}"
          releaseBody: |
            Linux build artifacts (.deb, .rpm, .AppImage) for this release.
            See the README for manual macOS build instructions.
          releaseDraft: true
          prerelease: false
