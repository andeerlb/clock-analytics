name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release:
    # tauri-action needs write access to create/update the GitHub Release —
    # some repos/orgs default GITHUB_TOKEN to read-only, which would 403.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          # A single universal .app/.dmg that runs on both Apple Silicon and
          # Intel Macs, instead of publishing two separate artifacts.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WebKitGTK/GTK for the Tauri webview, plus Poppler for the app's own
      # runtime PDF dependency (pdftotext/pdfseparate/pdfinfo/pdfunite).
      # macOS ships WebKit natively and doesn't need this step; Poppler
      # there is a *runtime* dependency for whoever runs the app, not a
      # build-time one (see the README's "PDF tooling" section).
      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            poppler-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # Safety net, not the primary flow: releasing is supposed to start
      # with `yarn version:bump X.Y.Z` (commit, then tag that commit), so
      # tauri.conf.json/Cargo.toml already match the tag by the time this
      # runs. This just re-applies the same bump to the CI runner's own
      # checkout — never committed anywhere — in case a release ever gets
      # tagged without bumping first, so the build still embeds a version
      # matching its own tag (the Settings > Sobre update check compares
      # `getVersion()` against the latest GitHub Release). A no-op on
      # workflow_dispatch off a branch, where github.ref_name isn't a tag.
      - name: Ensure app version matches the release tag
        if: startsWith(github.ref_name, 'v')
        run: node scripts/bump-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (see `createUpdaterArtifacts` in
          # tauri.conf.json) and produces `latest.json`, the manifest
          # `@tauri-apps/plugin-updater` polls via the GitHub Releases
          # endpoint configured there — without these, the build still
          # succeeds but no update manifest gets published.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PontoScan ${{ github.ref_name }}"
          releaseBody: |
            Linux (.deb, .rpm, .AppImage), macOS (.dmg, .app) and Windows (.msi, .exe) build
            artifacts for this release.

            Neither the macOS nor the Windows build is signed (no Apple Developer ID or code
            signing certificate yet), so the OS will warn on first install — this is expected,
            not a sign anything is wrong:

            - **macOS**: Gatekeeper blocks it ("cannot verify the developer" / "app is
              damaged"). Right-click the app > Abrir > confirm, or System Settings > Privacy
              & Security > "Abrir assim mesmo" after the first blocked attempt. If it still
              refuses, run `xattr -cr /Applications/PontoScan.app` in Terminal.
            - **Windows**: SmartScreen shows "Windows protected your PC" / "Unknown
              publisher". Click "More info" > "Run anyway".
            - **Linux**: no OS-level warning, but the AppImage needs its executable bit set
              first — `chmod +x PontoScan_*.AppImage` — before it'll run.

            This should only happen on the *initial* install: in-app updates (via "Procurar
            atualização" in Configurações) download through the app itself instead of a
            browser, so they shouldn't retrigger it. .deb/.rpm installs can't self-update this
            way and still need the new package downloaded and installed by hand.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
