name: Deploy web

# Every push to `web` tests, builds and publishes the web version:
#   1. server: cargo test → release build → binary to the releases bucket.
#      The VM checks that bucket every minute, installs the new binary and
#      rolls back on its own if it doesn't come up (infra/startup.sh.tftpl).
#   2. web: waits until the VM answers /api/version with this commit, then
#      builds the frontend and publishes it to Firebase Hosting — so the
#      new screens never go live before the API they call.
#
# Authentication is keyless (Workload Identity Federation, infra/deploy.tf):
# nothing secret is stored in GitHub. Every project-specific value comes from
# the variables of the `production` environment (Settings → Environments →
# production → Variables), so moving to another Google Cloud/Firebase project
# means changing those variables, not this file. None of them are secrets:
#   GCP_PROJECT, WIF_PROVIDER, DEPLOY_SA, RELEASES_BUCKET, API_URL
#     → printed by `tofu output github_variables` (infra/)
#   FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN, FIREBASE_APP_ID
#     → Firebase console → Configurações do projeto → Seus apps → app Web

on:
  push:
    branches: [web]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job ask GitHub for the OIDC token Google trusts

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-24.04 # same Ubuntu as the VM, so the binary's glibc matches
    environment: production
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      DEPLOY_SA: ${{ vars.DEPLOY_SA }}
      RELEASES_BUCKET: ${{ vars.RELEASES_BUCKET }}
    steps:
      - name: Check the environment variables
        run: |
          missing=""
          for name in GCP_PROJECT WIF_PROVIDER DEPLOY_SA RELEASES_BUCKET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltam variáveis no environment production do GitHub:$missing (veja o topo deste arquivo)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Test
        working-directory: server
        run: cargo test --locked

      - name: Build
        working-directory: server
        env:
          TAPAGO_BUILD_SHA: ${{ github.sha }}
        run: cargo build --release --locked

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Publish binary
        run: gcloud storage cp server/target/release/tapago-server "gs://${RELEASES_BUCKET}/tapago-server"

  web:
    needs: server
    runs-on: ubuntu-24.04
    environment: production
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      DEPLOY_SA: ${{ vars.DEPLOY_SA }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Check the environment variables
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          missing=""
          for name in GCP_PROJECT WIF_PROVIDER DEPLOY_SA API_URL FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_APP_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltam variáveis no environment production do GitHub:$missing (veja o topo deste arquivo)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_API_URL: ${{ vars.API_URL }}
        run: yarn build

      - name: Wait for the VM to run this commit
        run: |
          for i in $(seq 1 30); do
            running=$(curl -fsS --max-time 10 "${API_URL}/api/version" || true)
            if [ "$running" = "$GITHUB_SHA" ]; then
              echo "servidor no ar com ${GITHUB_SHA}"
              exit 0
            fi
            echo "aguardando a VM (rodando: ${running:-nada})"
            sleep 10
          done
          echo "::error::A VM não subiu a versão nova em 5 minutos. Veja: sudo journalctl -u tapago-update -u tapago"
          exit 1

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Publish to Firebase Hosting
        run: npx --yes firebase-tools@15.35.0 deploy --only hosting --project "${GCP_PROJECT}" --non-interactive
