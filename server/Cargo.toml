[package]
name = "pontoscan-server"
version = "0.1.91"
description = "PontoScan web backend"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON stored as text (e.g. conditions_json) keeps the key
# order the frontend sent, byte-for-byte what the desktop app wrote.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# Same sqlx line the desktop app uses (via tauri-plugin-sql), so the
# migrations (src-tauri/src/migrations_list.rs) produce identical checksums and a
# database exported from the desktop app opens here without a migration
# mismatch.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
futures-core = "0.3"
# Firebase ID tokens are RS256 JWTs signed by Google; v9 uses ring, so no
# aws-lc / cmake toolchain is needed to build the server.
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
