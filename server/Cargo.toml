[package]
name = "pontoscan-server"
version = "0.1.91"
description = "PontoScan web backend"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON stored as text (e.g. conditions_json) keeps the key
# order the frontend sent, byte-for-byte what the desktop app wrote.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# Same sqlx line the desktop app used (via tauri-plugin-sql), so the
# migrations (src/migrations_list.rs) produce identical checksums and a
# database from the desktop app opens here without a migration mismatch.
# Don't bump the minor version without checking that.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
futures-core = "0.3"
# The assistant's SQLite authorizer (`ai/investigation.rs`): the same
# libsqlite3-sys sqlx 0.8 links, so this adds no second SQLite.
libsqlite3-sys = { version = "0.30", default-features = false }
# Firebase ID tokens are RS256 JWTs signed by Google; v9 uses ring, so no
# aws-lc / cmake toolchain is needed to build the server.
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }

# Domain code carried over from the desktop app (src/core) — same versions.
regex = "1.13.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
sha2 = "0.11.0"
zip = "2"
calamine = { version = "0.36.1", features = ["dates"] }
csv = "1.4.0"
infer = "0.19.0"
url = "2"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
