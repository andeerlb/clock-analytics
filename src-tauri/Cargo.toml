[package]
name = "pontoscan"
version = "0.1.85"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pontoscan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "tray-icon": the "Minimizar na bandeja ao fechar" setting (Configurações)
# needs a real tray icon to hide the window into — off by default upstream
# since it pulls in extra platform deps (e.g. libayatana-appindicator on
# Linux) that not every app wants.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
# Native window blur-behind (Acrylic on Windows, Vibrancy on macOS) toggled
# by `window_glass::set_window_glass` while a Modal/Drawer backdrop is
# visible — see that module for why Linux has no branch here at all.
window-vibrancy = "0.6"
# A second launch re-focuses the already-running window instead of starting
# a second process — see the `#[cfg(desktop)]` block in `lib.rs::run`.
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13.1"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
# Same sqlx the SQL plugin already pulls in — used directly only by
# `db_batch::run_write_batch`, to run a multi-statement write as one
# transaction on the plugin's own pool.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "json"] }
thiserror = "2.0.19"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
sha2 = "0.11.0"
zip = "2"
calamine = { version = "0.36.1", features = ["dates"] }
csv = "1.4.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# OS notification when a background check finds a real change while the
# window is hidden/unfocused — see RemoteFileUpdatesContext.tsx.
tauri-plugin-notification = "2"
# Anonymous direct-download of a payment spreadsheet by URL, and the cheap
# HEAD-based "did it change" check — rustls-no-provider (not reqwest's own
# `rustls` feature) to reuse the same rustls+ring stack tauri-plugin-updater
# already pulls in, instead of compiling in a second (aws-lc-rs) backend.
# `cookies`: OneDrive/SharePoint's anonymous-link "redemption" flow sets a
# cookie partway through its redirect chain and expects it back on the next
# hop — without a cookie jar the chain dead-ends on a login page instead of
# the file, even for a link that never actually requires signing in.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "cookies"] }
# Magic-byte validation that a downloaded response is really an .xlsx/.xls
# file, not e.g. an HTML login page some "direct download" links redirect to.
infer = "0.19.0"
# Stores the AI assistant's API key in the OS credential store instead of
# settings.json. The async-secret-service/crypto-rust pairing talks to the
# Linux Secret Service over pure-Rust zbus, so the release build doesn't need
# libdbus headers.
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
# The AI assistant locks its SQL connection down with a SQLite authorizer,
# which sqlx doesn't expose. No features here: same library sqlx already builds.
libsqlite3-sys = { version = "0.30", default-features = false }
# Backoff between Claude API retries, and running the installed Claude Code.
tokio = { version = "1", features = ["time", "process", "io-util"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
