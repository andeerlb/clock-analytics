[package]
name = "pontoscan"
version = "0.1.27"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pontoscan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13.1"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
thiserror = "2.0.19"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
sha2 = "0.11.0"
zip = "2"
calamine = { version = "0.36.1", features = ["dates"] }
csv = "1.4.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Anonymous direct-download of a payment spreadsheet by URL, and the cheap
# HEAD-based "did it change" check — rustls-no-provider (not reqwest's own
# `rustls` feature) to reuse the same rustls+ring stack tauri-plugin-updater
# already pulls in, instead of compiling in a second (aws-lc-rs) backend.
# `cookies`: OneDrive/SharePoint's anonymous-link "redemption" flow sets a
# cookie partway through its redirect chain and expects it back on the next
# hop — without a cookie jar the chain dead-ends on a login page instead of
# the file, even for a link that never actually requires signing in.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "cookies"] }
# Magic-byte validation that a downloaded response is really an .xlsx/.xls
# file, not e.g. an HTML login page some "direct download" links redirect to.
infer = "0.19.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
